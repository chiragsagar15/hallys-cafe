spring.application.name=hallys-contact-backend

server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/hallys
spring.datasource.username=sa
spring.datasource.password=${HALLYS_DB_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${HALLYS_MAIL_USERNAME}
spring.mail.password=${HALLYS_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

hallys.contact.recipient=${HALLYS_MAIL_RECIPIENT}
